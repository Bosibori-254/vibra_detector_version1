[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeguard-plc-sim"
version = "0.1.0"
description = "Simulated OPC UA / Modbus VFD, pump and valve for PipeGuard"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
opcua = ["asyncua>=1.1", "pymodbus>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.9"]

[project.scripts]
pipeguard-plc-sim = "plc_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
